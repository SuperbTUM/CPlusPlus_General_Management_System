name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Native C++20 / C++23 build and comprehensive automated test suites
  native-build-and-test:
    name: Native Build & Test (Ubuntu 24.04 / GCC 14)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Compiler & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 \
            g++-14 \
            cmake \
            libssl-dev \
            libsqlite3-dev \
            libomp-dev \
            ninja-build

      - name: Configure CMake
        run: |
          cmake -B Back-end/build -S Back-end \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14

      - name: Compile Backend & Test Executables
        run: cmake --build Back-end/build --parallel

      - name: Run Modern C++ Feature Tests (9 Tests)
        run: ./Back-end/build/bin/modern_cpp_test

      - name: Run End-to-End Network Integration Tests (10 Steps)
        run: ./Back-end/build/bin/e2e_network_test

  # Job 2: Multi-stage Docker container build and isolated test verification
  docker-verification:
    name: Docker Container Build & Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        run: docker build -t cplusplus-server:latest .

      - name: Verify Container Unit Tests
        run: docker run --rm --entrypoint /app/bin/modern_cpp_test cplusplus-server:latest

      - name: Verify Container E2E Network Tests
        run: docker run --rm --entrypoint /app/bin/e2e_network_test cplusplus-server:latest
